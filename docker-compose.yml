services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password_change_me}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password_change_me}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD:-redis_password_change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        GA_ID: ${GA_ID:-GA_ID_PLACEHOLDER}
    image: healer:latest
    command: uvicorn healer.web.app:app --host 0.0.0.0 --port 8000 --workers 1 --access-log
    env_file:
      - path: .env
        required: false
    environment:
      # These override any same-named vars from .env
      - HEALER_REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password_change_me}@redis:6379/0
      - HEALER_DATA_DIR=/buildingblocks
    volumes:
      - ${HEALER_DATA_DIR:-./healer/data/buildingblocks}:/buildingblocks:ro
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


  frontend:
    build:
      context: ./web_client
      dockerfile: Dockerfile.dev
    volumes:
      - ./web_client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_TARGET=http://backend:8000
    depends_on:
      - backend
